name: Update Material Icon Theme

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Optional exact material-icon-theme npm version (defaults to latest stable)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-material-icons:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: source/remya-launcher
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: source/remya-launcher
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: source/remya-launcher/package-lock.json

      - name: Resolve target material-icon-theme version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.target_version }}
        run: |
          current=$(node -p "require('./package.json').devDependencies['material-icon-theme']")
          target="${INPUT_VERSION:-}"
          if [[ -z "$target" ]]; then
            target=$(npm view material-icon-theme dist-tags.latest)
          fi
          number='(0|[1-9][0-9]*)'
          identifiers='[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*'
          if [[ ! "$target" =~ ^$number\.$number\.$number(-$identifiers)?(\+$identifiers)?$ ]]; then
            echo "::error::Expected an exact material-icon-theme npm version."
            exit 1
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          if [[ "$current" != "$target" || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Remya Core
        if: steps.version.outputs.update == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: remyhuang03/remya-core
          ref: d4273d05c4fed7fe5e9420d5477869c06067a7be
          path: source/remya-core
          persist-credentials: false

      - name: Install FVM
        if: steps.version.outputs.update == 'true'
        run: |
          fvm_archive=$(mktemp)
          curl --fail --location --retry 3 \
            https://github.com/btwld/fvm/releases/download/4.3.2/fvm-4.3.2-linux-x64.tar.gz \
            --output "$fvm_archive"
          echo "17dfced05f5b0cb32398dadd0691acc2bc458e8c4b0045a781cd5aa6c85f6ecb  $fvm_archive" | sha256sum -c -
          tar -xzf "$fvm_archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/fvm" >> "$GITHUB_PATH"

      - name: Install dependencies and sync assets
        if: steps.version.outputs.update == 'true'
        env:
          TARGET_VERSION: ${{ steps.version.outputs.target }}
        run: |
          npm install --no-fund --no-audit --save-dev --save-exact "material-icon-theme@$TARGET_VERSION"
          npm ci --no-fund --no-audit
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync("/tmp/before-manifest.json", fs.readFileSync("assets/material_icon_theme/manifest.json"));
            fs.writeFileSync("/tmp/before-seeds.json", fs.readFileSync("assets/material_icon_theme/seeds.json"));
          '
          npm run sync-icons

      - name: Verify determinism and Flutter tests
        if: steps.version.outputs.update == 'true'
        run: |
          node tool/sync_material_icons.mjs --check
          fvm install --skip-pub-get
          fvm flutter pub get --enforce-lockfile
          fvm flutter analyze --no-pub
          fvm flutter test --no-pub test/file_icon_resolver_test.dart test/file_icon_palette_test.dart test/clipboard_launcher_test.dart

      - name: Summarize icon and seed diffs
        if: steps.version.outputs.update == 'true'
        run: |
          node -e '
            const fs = require("node:fs");
            const beforeM = JSON.parse(fs.readFileSync("/tmp/before-manifest.json", "utf8"));
            const afterM = JSON.parse(fs.readFileSync("assets/material_icon_theme/manifest.json", "utf8"));
            const beforeS = JSON.parse(fs.readFileSync("/tmp/before-seeds.json", "utf8"));
            const afterS = JSON.parse(fs.readFileSync("assets/material_icon_theme/seeds.json", "utf8"));
            const beforeIds = new Set(Object.keys(beforeM.assets));
            const afterIds = new Set(Object.keys(afterM.assets));
            const addedIcons = [...afterIds].filter(x => !beforeIds.has(x));
            const removedIcons = [...beforeIds].filter(x => !afterIds.has(x));
            const seedChanges = [...afterIds]
              .filter(x => beforeIds.has(x) && beforeS.seeds[x] !== afterS.seeds[x])
              .map(x => `${x}: ${beforeS.seeds[x]} -> ${afterS.seeds[x]}`);
            const lines = [
              `### Material Icon Theme Update`,
              ``,
              `- **Version:** \`${beforeS.sourceVersion}\` -> \`${afterS.sourceVersion}\``,
              `- **Icons:** ${beforeIds.size} -> ${afterIds.size} (+${addedIcons.length} / -${removedIcons.length})`,
              `- **Seed changes:** ${seedChanges.length}`,
            ];
            if (addedIcons.length) lines.push(``, `<details><summary>Added icons (${addedIcons.length})</summary>`, ``, addedIcons.slice(0, 100).map(x => `- \`${x}\``).join("\n"), `</details>`);
            if (removedIcons.length) lines.push(``, `<details><summary>Removed icons (${removedIcons.length})</summary>`, ``, removedIcons.slice(0, 100).map(x => `- \`${x}\``).join("\n"), `</details>`);
            if (seedChanges.length) lines.push(``, `<details><summary>Changed seeds (${seedChanges.length})</summary>`, ``, seedChanges.slice(0, 100).map(x => `- \`${x}\``).join("\n"), `</details>`);
            fs.writeFileSync("/tmp/pr-summary.md", lines.join("\n"));
          '

      - name: Create Pull Request
        if: steps.version.outputs.update == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          path: source/remya-launcher
          commit-message: "chore(assets): update material-icon-theme to ${{ steps.version.outputs.target }}"
          branch: "chore/material-icon-theme-${{ steps.version.outputs.target }}"
          title: "chore(assets): update material-icon-theme to ${{ steps.version.outputs.target }}"
          body-path: /tmp/pr-summary.md
          delete-branch: true
