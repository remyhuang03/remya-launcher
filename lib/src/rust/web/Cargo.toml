[package]
name = "remya_launcher_web"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "remya-launcher-web"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
gio = { version = "0.21", features = ["v2_60"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico"] }
rusqlite = { version = "0.41", features = ["bundled", "serialize"] }
rustix = { version = "1", features = ["fs", "process", "stdio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
url = "2"

[dev-dependencies]
tempfile = "3"
