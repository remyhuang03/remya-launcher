[package]
name = "remya_launcher_apps"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "remya-launcher-apps"
path = "src/main.rs"

[dependencies]
flate2 = "1.1"
gio = { version = "0.21", features = ["v2_60"] }
inotify = { version = "0.9", default-features = false }
pinyin = "0.11"
quick-xml = "0.41"
rustix = { version = "1", features = ["fs", "net", "process", "stdio"] }
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
