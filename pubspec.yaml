name: remya_launcher
description: "A Material Design 3 Expressive launcher UI for Hyprland on Linux."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  emoji_picker_i18n: 1.1.0
  flutter_svg: ^2.3.2
  material_color_utilities: ^0.13.0
  remya_client:
    path: ../remya-core/packages/remya_client
  remya_ui:
    path: ../remya-core/packages/remya_ui
  material_ui: ^1.5.0
  unorm_dart: 0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - assets/emoji/
    - assets/icons/
    - assets/preview/
    - assets/licenses/
    - assets/material_icon_theme/manifest.json
    - assets/material_icon_theme/seeds.json
    - assets/material_icon_theme/metadata.json
    - assets/material_icon_theme/LICENSE
    - assets/material_icon_theme/icons/
